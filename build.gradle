plugins {
    id 'fabric-loom' version '1.14.10'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mc_range', project.mc_range
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'mc_range': project.mc_range, 'java_version': project.java_version }
}

// Pequeñas diferencias de API entre versiones de Minecraft viven en src/compat/<variante>.
sourceSets.main.java.srcDir "src/compat/${project.compat}/java"
sourceSets.main.java.srcDir "src/fam-${project.family}/java"
if (project.family == 'ms15') sourceSets.main.java.exclude { el -> el.file.absolutePath.contains('/src/main/java/') && (el.name == 'NovaClient.java' || el.name == 'KeystrokesModule.java') } // ms15 trae sus propias copias (otra ruta de KeyBinding)

tasks.withType(JavaCompile).configureEach { options.release = (project.java_version as int) }
java { withSourcesJar(); sourceCompatibility = JavaVersion.toVersion(project.java_version); targetCompatibility = JavaVersion.toVersion(project.java_version) }
