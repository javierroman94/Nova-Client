name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.versiones.outputs.matriz) }}
    needs: versiones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.0' }
      - name: Compilar para ${{ matrix.mc }}
        run: >
          gradle build --no-daemon
          -Pminecraft_version=${{ matrix.mc }}
          -Pyarn_mappings=${{ matrix.yarn }}
          -Pfabric_version=${{ matrix.fabric }}
          -Pjava_version=${{ matrix.java }}
          -Pmc_range="~${{ matrix.mc }}"
          -Pcompat=${{ matrix.compat }}
          -Pfamily=${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        with:
          name: nova-client-${{ matrix.mc }}
          path: build/libs/nova-client-*+mc${{ matrix.mc }}.jar

  versiones:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matriz=$(jq -c . versions.json)" >> "$GITHUB_OUTPUT"

  build26:
    name: Minecraft ${{ matrix.mc }} (26.x)
    runs-on: ubuntu-latest
    needs: versiones26
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.versiones26.outputs.matriz) }}
    defaults:
      run:
        working-directory: mj26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.0' }
      - name: Compilar para ${{ matrix.mc }}
        run: >
          gradle build --no-daemon
          -Pminecraft_version=${{ matrix.mc }}
          -Pfabric_version=${{ matrix.fabric }}
          -Pfamily=${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        with:
          name: nova-client-${{ matrix.mc }}
          path: mj26/build/libs/nova-client-*+mc${{ matrix.mc }}.jar

  versiones26:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matriz=$(jq -c . mj26/versions.json)" >> "$GITHUB_OUTPUT"

  # Publica los .jar en una release cuando llega una etiqueta vX.Y.Z, o cuando se sube a main
  # un mod_version nuevo en gradle.properties (la etiqueta se crea sola si no existe).
  publicar:
    if: github.event_name == 'push'
    needs: [build, build26]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"
          else tag="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"; fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "La versión $tag ya está publicada."; echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.tag != ''
        uses: actions/download-artifact@v4
        with: { path: jars, pattern: nova-client-*, merge-multiple: true }
      - if: steps.v.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: jars/*.jar
          generate_release_notes: true
