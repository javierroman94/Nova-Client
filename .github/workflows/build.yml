name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.versiones.outputs.matriz) }}
    needs: versiones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.0' }
      - name: Compilar para ${{ matrix.mc }}
        run: >
          gradle build --no-daemon
          -Pminecraft_version=${{ matrix.mc }}
          -Pyarn_mappings=${{ matrix.yarn }}
          -Pfabric_version=${{ matrix.fabric }}
          -Pjava_version=${{ matrix.java }}
          -Pmc_range="~${{ matrix.mc }}"
          -Pcompat=${{ matrix.compat }}
      - uses: actions/upload-artifact@v4
        with:
          name: nova-client-${{ matrix.mc }}
          path: build/libs/nova-client-*+mc${{ matrix.mc }}.jar

  versiones:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matriz=$(jq -c . versions.json)" >> "$GITHUB_OUTPUT"

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: jars, pattern: nova-client-*, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true
